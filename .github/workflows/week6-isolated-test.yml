name: Week 6 isolated database test
on:
  push:
    branches: [codex/week6-pickem-readiness-20260926]
  workflow_dispatch:
jobs:
  isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.118.0
      - run: supabase init
      - run: supabase db start
      - run: supabase db reset --local --no-seed
      - run: supabase db query --local --file supabase/tests/pickem_week6_contest.sql
