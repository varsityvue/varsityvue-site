name: Score Scout approval repair verification
on:
  push:
    branches: [codex/score-scout-approval-repair]
  pull_request:
    paths:
      - '.github/workflows/score-scout-repair.yml'
      - 'app/internal/score-intelligence/**'
      - 'lib/score-scout-review*'
      - 'supabase/migrations/*score_scout_approval_repair.sql'
      - 'supabase/tests/score_scout*'
jobs:
  score-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test lib/score-scout-review.test.tsx lib/public-score-state.test.tsx lib/scoring-operations.test.ts lib/games.test.ts lib/school-scoring-averages.test.ts
      - run: npx tsc --noEmit
      - uses: supabase/setup-cli@v2
        with:
          version: 2.119.0
      - run: supabase init
      - run: supabase db start
      - run: supabase db reset --local --no-seed
      - name: Attribution database tests
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/public_score_attribution.sql
      - name: Seed isolated regression actors
        run: |
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres <<'SQL'
          insert into auth.users(id,instance_id,aud,role,email,encrypted_password,email_confirmed_at,raw_app_meta_data,raw_user_meta_data,created_at,updated_at)
          select ('00000000-0000-4000-8000-00000000090'||n)::uuid,'00000000-0000-0000-0000-000000000000','authenticated','authenticated',
          'regression-'||n||'@example.invalid','!',now(),'{}','{}',now(),now() from generate_series(1,3) n;
          insert into public.user_roles(user_id,role) values
          ('00000000-0000-4000-8000-000000000901','admin'),('00000000-0000-4000-8000-000000000902','moderator');
          SQL
      - name: Existing scoring and Pick Em regressions
        run: |
          for file in friday_scoring_operations game_score_corrections pickem_score_integration pickem_scoreless_outcome_origination; do
            PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "supabase/tests/$file.sql" || exit 1
          done
      - name: Existing concurrent scoring regressions
        run: |
          PGPASSWORD=postgres bash supabase/tests/friday_scoring_race.sh

      - name: Score Scout disposable database tests
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/score_scout_approval.sql
      - name: Score Scout concurrent review/scoring tests
        run: PGPASSWORD=postgres bash supabase/tests/score_scout_race.sh
      - name: Targeted lint and full build
        run: |
          npx eslint app/internal/score-intelligence lib/score-scout-review.ts lib/score-scout-review.test.tsx
          npm run build
          git diff --check
