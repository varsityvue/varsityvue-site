name: Followed-team V1 verification
on:
  push:
    branches: [codex/followed-team-personalization-v1-20260928]
  pull_request:
    paths:
      - 'lib/follow*'
      - 'app/page.tsx'
      - 'app/scoreboard/page.tsx'
      - 'components/ScoresExplorer.tsx'
      - 'components/YourTeams.tsx'
      - 'components/AccountFollowList.tsx'
      - 'components/SchoolHero.tsx'
      - 'app/games/**'
      - 'app/coverage/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test lib/follow-personalization.test.ts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
