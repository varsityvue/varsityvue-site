name: Assigned scorekeeper LIVE V1 verification
on:
  push:
    branches: [codex/assigned-scorekeeper-live-v1]
  pull_request:
    paths:
      - '.github/workflows/assigned-scorekeeper-live-v1.yml'
      - 'app/report-score/**'
      - 'app/account/page.tsx'
      - 'lib/assigned-scorekeeper*'
      - 'lib/member-access.ts'
      - 'lib/member-status*'
      - 'lib/business-conflict*'
      - 'lib/score-conflict*'
      - 'lib/score-scout-review*'
      - 'app/account-unavailable/**'
      - 'app/login/actions.ts'
      - 'app/internal/pickem/actions.ts'
      - 'app/internal/score-review/**'
      - 'app/internal/score-intelligence/actions.ts'
      - 'supabase/migrations/*week8_p0_nonretryable_business_conflicts.sql'
      - 'supabase/migrations/*emergency_score_review_nonretryable_conflict.sql'
      - 'supabase/tests/week8_p0*'
      - 'supabase/tests/*.sql'
      - 'supabase/tests/*race.sh'
      - 'scripts/test-week8-p0-migration.mjs'
      - 'supabase/migrations/*assigned_scorekeeper_live_v1.sql'
      - 'supabase/tests/assigned_scorekeeper*'
      - 'scripts/test-assigned-scorekeeper-browser.mjs'
jobs:
  assigned-scorekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test lib/assigned-scorekeeper.test.ts lib/assigned-scorekeeper-games.test.ts lib/score-scout-review.test.tsx lib/public-score-state.test.tsx lib/scoring-operations.test.ts lib/games.test.ts lib/school-scoring-averages.test.ts lib/pickem-lifecycle.test.ts lib/pickem-client-state.test.ts lib/pickem-week-summary.test.ts lib/pickem-contest-display.test.ts
      - run: npx tsc --noEmit
      - run: node --import tsx --test lib/member-status.test.ts lib/business-conflict.test.ts lib/score-conflict.test.ts
      - run: node scripts/test-week8-p0-migration.mjs
      - uses: supabase/setup-cli@v2
        with:
          version: 2.119.0
      - run: supabase init
      - run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,inbucket
      - run: supabase db reset --local --no-seed
      - name: Attribution database tests
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/public_score_attribution.sql
      - name: Assigned scorekeeper authority database tests
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/assigned_scorekeeper_live.sql
      - name: Seed isolated regression actors
        run: |
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres <<'SQL'
          insert into auth.users(id,instance_id,aud,role,email,encrypted_password,email_confirmed_at,raw_app_meta_data,raw_user_meta_data,created_at,updated_at)
          select ('00000000-0000-4000-8000-00000000090'||n)::uuid,'00000000-0000-0000-0000-000000000000','authenticated','authenticated',
          'regression-'||n||'@example.invalid','!',now(),'{}','{}',now(),now() from generate_series(1,3) n;
          insert into public.user_roles(user_id,role) values
          ('00000000-0000-4000-8000-000000000901','admin'),('00000000-0000-4000-8000-000000000902','moderator');
          SQL
      - name: Existing scoring and Pick Em regressions
        run: |
          for file in friday_scoring_operations game_score_corrections pickem_score_integration pickem_scoreless_outcome_origination; do
            PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "supabase/tests/$file.sql" || exit 1
          done
      - name: Existing concurrent scoring regressions
        run: |
          PGPASSWORD=postgres bash supabase/tests/friday_scoring_race.sh
          PGHOST=127.0.0.1 PGPORT=54322 PGPASSWORD=postgres timeout 60s python3 supabase/tests/week8_p0_native.py
      - name: Complete conflict classification regressions
        run: |
          for file in pickem_future_week_admin pickem_outcome_schedule pickem_admin_outcomes public_uuid_hardening; do
            PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "supabase/tests/$file.sql" || exit 1
          done

      - name: Score Scout disposable database tests
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/score_scout_approval.sql
      - name: Score Scout concurrent review/scoring tests
        run: PGPASSWORD=postgres bash supabase/tests/score_scout_race.sh
      - name: Assigned scorekeeper publication/revocation races
        run: PGPASSWORD=postgres bash supabase/tests/assigned_scorekeeper_race.sh
      - name: Targeted lint and full build
        run: |
          npx eslint app/report-score/actions.ts app/report-score/page.tsx app/report-score/TrustedLiveScoreForm.tsx lib/assigned-scorekeeper.ts lib/assigned-scorekeeper.test.ts lib/assigned-scorekeeper-games.ts lib/assigned-scorekeeper-games.test.ts app/account/page.tsx
          npm run build
          git diff --check
      - name: Authenticated browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Authenticated assigned scorekeeper browser verification (local only)
        run: |
          supabase status -o env > "$RUNNER_TEMP/keeper-local.env"
          KEEPER_LOCAL_ENV="$RUNNER_TEMP/keeper-local.env" node scripts/test-assigned-scorekeeper-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assigned-scorekeeper-browser-evidence
          path: assigned-scorekeeper-browser-evidence
          if-no-files-found: ignore
