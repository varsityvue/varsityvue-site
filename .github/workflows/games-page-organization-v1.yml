name: Games Page Organization V1
on:
  pull_request:
    paths: ['app/games/page.tsx', 'components/GamesNearbyDisclosure.tsx', 'lib/games-page-organization*', 'scripts/test-games-organization-browser.mjs', '.github/workflows/games-page-organization-v1.yml']
  push:
    branches: [codex/games-page-organization-v1]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test lib/games-page-organization.test.ts lib/game-presentation.test.ts lib/game-discovery.test.ts lib/follow-personalization.test.ts lib/public-score-loader.test.ts lib/hamilton-featured.test.ts lib/public-read-contracts.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint app/games/page.tsx components/GamesNearbyDisclosure.tsx lib/games-page-organization.ts lib/games-page-organization.test.ts
      - run: npm run build
      - run: git diff --check
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-games-organization-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-organization-browser-evidence
          path: games-organization-browser-evidence
