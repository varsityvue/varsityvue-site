name: Regional Semifinal production acceptance
on:
  push:
    branches: [main]
    paths:
      - 'data/playoff-regional-semifinals-2026.json'
      - 'data/playoff-regional-semifinals.ts'
      - 'scripts/verify-regional-production.mjs'
      - '.github/workflows/regional-semifinal-production.yml'
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-regional-production.mjs
