name: Temporary score tie integration gate
on:
  push:
    branches: [verification/score-tie-integration-20260926]
jobs:
  isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.118.0
      - run: supabase init
      - run: supabase db start
      - run: supabase db reset --local --no-seed
      - run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/pickem_week6_contest.sql
