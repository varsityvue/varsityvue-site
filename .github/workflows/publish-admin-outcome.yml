name: Publish administrator outcome workflow
on:
  push:
    branches: [codex/admin-outcome-publish-20260921]
permissions:
  contents: write
jobs:
  verify-migrate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      START_MAIN: 8726f8f594688310e315ab71dfcc66c05071d129
      FEATURE_COMMIT: ab45f25e902b83765b2fc9d21fc37e340609778b
      EXPECTED_MIGRATION: "20260921195006"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Validate exact feature scope and history
        shell: bash
        run: |
          set -euo pipefail; set +x
          test "$SUPABASE_PROJECT_ID" = "outsnqcwrqfllusnljtv"
          test "$(git rev-parse HEAD^)" = "$FEATURE_COMMIT"
          test "$(git rev-parse HEAD^^)" = "$START_MAIN"
          expected=$(mktemp); actual=$(mktemp)
          printf '%s\n' app/internal/score-review/CanonicalOutcomeForm.tsx app/internal/score-review/actions.ts app/internal/score-review/page.tsx lib/admin-outcome.test.ts lib/admin-outcome.ts package.json supabase/migrations/20260921195006_administrator_canonical_outcome_workflow.sql supabase/tests/pickem_admin_outcomes.sql | sort > "$expected"
          git diff --name-only "$START_MAIN" "$FEATURE_COMMIT" | sort > "$actual"
          diff -u "$expected" "$actual"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 59
          git ls-tree -r "$START_MAIN" supabase/migrations | awk '{print $3" "$4}' | sort > /tmp/before
          git ls-tree -r "$FEATURE_COMMIT" supabase/migrations | awk -v m="$EXPECTED_MIGRATION" '$4 !~ m {print $3" "$4}' | sort > /tmp/after
          diff -u /tmp/before /tmp/after
          test "$(git ls-tree -r "$FEATURE_COMMIT" supabase/migrations | awk -v m="$EXPECTED_MIGRATION" '$4 ~ m {n++} END{print n+0}')" -eq 1
          ! git diff "$START_MAIN" "$FEATURE_COMMIT" -- . ':(exclude)supabase/migrations/20260921195006_administrator_canonical_outcome_workflow.sql' | grep -Eiq 'email|notification'
          git diff --check "$START_MAIN" "$FEATURE_COMMIT"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail
          npm run test:games
          npm run test:pickem-lifecycle
          npm run test:pickem-interactions
          npm run test:pickem-logos
          npm run test:pickem-admin-outcomes
          npx tsc --noEmit
          npm run lint
          npm run build
          git diff --check
      - name: Verify database locally
        shell: bash
        run: |
          set -euo pipefail; set +x
          npx --yes supabase@2.117.0 --version
          npx --yes supabase@2.117.0 init --force >/tmp/supabase-init.log 2>&1
          npx --yes supabase@2.117.0 start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >/tmp/supabase-start.log 2>&1
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_')"
          test -n "$db_container"; echo "DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          curl -fsSL https://raw.githubusercontent.com/varsityvue/varsityvue-site/e245bd71677aa2025be7158db3b1e36ad3893d56/scripts/admin-outcome-test-identities.sql -o /tmp/identities.sql
          curl -fsSL https://raw.githubusercontent.com/varsityvue/varsityvue-site/e245bd71677aa2025be7158db3b1e36ad3893d56/scripts/verify-admin-outcome-concurrency.sh -o /tmp/concurrency.sh
          chmod 700 /tmp/concurrency.sh
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < /tmp/identities.sql
          for s in supabase/tests/pickem_lifecycle.sql supabase/tests/pickem_outcome_schedule.sql supabase/tests/pickem_rls.sql supabase/tests/pickem_admin_outcomes.sql; do
            docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$s"
          done
          /tmp/concurrency.sh "$db_container"
          npx --yes supabase@2.117.0 db lint --local --level error --fail-on error
      - name: Authenticate and prove exact pre-migration parity
        shell: bash
        run: |
          set -euo pipefail; set +x
          npx --yes supabase@2.117.0 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.117.0 migration list --linked --password "$SUPABASE_DB_PASSWORD" --output-format json > /tmp/list-before.json
          python3 - <<'PY'
          import json, re
          doc=json.load(open('/tmp/list-before.json'))
          found=[]
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == 'migrations':
                          if not isinstance(child, list): raise AssertionError('migrations payload is not a list')
                          found.append(child)
                      walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(doc)
          assert len(found)==1, f'ambiguous migrations payload count: {len(found)}'
          rows=found[0]
          assert rows and all(isinstance(r,dict) and all(isinstance(r.get(k),str) for k in ('local','remote','time')) for r in rows), 'malformed migration rows'
          local=[r['local'] for r in rows if r['local']]
          remote=[r['remote'] for r in rows if r['remote']]
          assert all(re.fullmatch(r'\d{14}',v) for v in local+remote), 'invalid migration version'
          assert len(local)==59 and len(set(local))==59, local
          assert len(remote)==58 and len(set(remote))==58, remote
          assert [r['local'] for r in rows if r['local'] and not r['remote']]==['20260921195006'], rows
          assert not [r for r in rows if r['remote'] and not r['local']], rows
          assert all(r['local']==r['remote'] for r in rows if r['local'] and r['remote']), rows
          PY
          npx --yes supabase@2.117.0 db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1 | tee /tmp/dry-run
          test "$(grep -c '20260921195006_administrator_canonical_outcome_workflow.sql' /tmp/dry-run)" -eq 1
          test "$(grep -Eo '[0-9]{14}_[A-Za-z0-9_]+\.sql' /tmp/dry-run | sort -u | wc -l)" -eq 1
      - name: Capture production safety baseline
        shell: bash
        run: |
          set -euo pipefail; set +x
          SQL="select json_build_object('game_rows',(select count(*) from public.game_state),'away_sum',(select coalesce(sum(away_score),0) from public.game_state),'home_sum',(select coalesce(sum(home_score),0) from public.game_state),'results',(select count(*) from public.game_state where result_type is not null),'winners',(select count(*) from public.game_state where official_winner_school_slug is not null),'picks',(select count(*) from public.pickem_picks),'correct',(select count(*) from public.pickem_picks where is_correct is true),'incorrect',(select count(*) from public.pickem_picks where is_correct is false),'totals_rows',(select count(*) from public.pickem_member_totals),'graded',(select coalesce(sum(graded_picks),0) from public.pickem_member_totals),'total_correct',(select coalesce(sum(correct_picks),0) from public.pickem_member_totals),'total_incorrect',(select coalesce(sum(incorrect_picks),0) from public.pickem_member_totals),'product_events',(select count(*) from private.product_notification_events),'product_deliveries',(select count(*) from private.product_email_deliveries),'member_events',(select count(*) from private.member_notification_events),'reminders',(select count(*) from private.pickem_reminder_deliveries)) as snapshot;"
          npx --yes supabase@2.117.0 db query --linked --output-format json "$SQL" > /tmp/safety-before
          jq -c '..|objects|select(has("snapshot"))|.snapshot' /tmp/safety-before | head -1 > /tmp/snapshot-before
          test -s /tmp/snapshot-before
      - name: Apply exactly one production migration
        shell: bash
        run: |
          set -euo pipefail; set +x
          npx --yes supabase@2.117.0 db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Verify post-migration parity and safety
        shell: bash
        run: |
          set -euo pipefail; set +x
          npx --yes supabase@2.117.0 migration list --linked --password "$SUPABASE_DB_PASSWORD" --output-format json > /tmp/list-after.json
          python3 - <<'PY'
          import json, re
          doc=json.load(open('/tmp/list-after.json'))
          found=[]
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == 'migrations':
                          if not isinstance(child, list): raise AssertionError('migrations payload is not a list')
                          found.append(child)
                      walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(doc)
          assert len(found)==1, f'ambiguous migrations payload count: {len(found)}'
          rows=found[0]
          assert len(rows)==59, rows
          assert all(isinstance(r,dict) and all(isinstance(r.get(k),str) for k in ('local','remote','time')) for r in rows), 'malformed migration rows'
          local=[r['local'] for r in rows]; remote=[r['remote'] for r in rows]
          assert all(re.fullmatch(r'\d{14}',v) for v in local+remote), 'invalid migration version'
          assert len(set(local))==59 and len(set(remote))==59, rows
          assert all(r['local']==r['remote'] for r in rows), rows
          assert '20260921195006' in local, local
          PY
          SQL="select json_build_object('game_rows',(select count(*) from public.game_state),'away_sum',(select coalesce(sum(away_score),0) from public.game_state),'home_sum',(select coalesce(sum(home_score),0) from public.game_state),'results',(select count(*) from public.game_state where result_type is not null),'winners',(select count(*) from public.game_state where official_winner_school_slug is not null),'picks',(select count(*) from public.pickem_picks),'correct',(select count(*) from public.pickem_picks where is_correct is true),'incorrect',(select count(*) from public.pickem_picks where is_correct is false),'totals_rows',(select count(*) from public.pickem_member_totals),'graded',(select coalesce(sum(graded_picks),0) from public.pickem_member_totals),'total_correct',(select coalesce(sum(correct_picks),0) from public.pickem_member_totals),'total_incorrect',(select coalesce(sum(incorrect_picks),0) from public.pickem_member_totals),'product_events',(select count(*) from private.product_notification_events),'product_deliveries',(select count(*) from private.product_email_deliveries),'member_events',(select count(*) from private.member_notification_events),'reminders',(select count(*) from private.pickem_reminder_deliveries)) as snapshot;"
          npx --yes supabase@2.117.0 db query --linked --output-format json "$SQL" > /tmp/safety-after
          jq -c '..|objects|select(has("snapshot"))|.snapshot' /tmp/safety-after | head -1 > /tmp/snapshot-after
          diff -u /tmp/snapshot-before /tmp/snapshot-after
          npx --yes supabase@2.117.0 db query --linked "do \$q\$ begin if (select count(*) from private.game_outcome_audit)<>0 then raise exception 'audit residue'; end if; if exists(select 1 from public.game_state where game_id like '__admin_outcome%') or exists(select 1 from public.pickem_games where game_id like '__admin_outcome%') or exists(select 1 from public.profiles where coalesce(username,'') like '__admin_outcome%') then raise exception 'fixture residue'; end if; if exists(select 1 from public.pickem_member_totals where graded_picks<>correct_picks+incorrect_picks) then raise exception 'aggregate mismatch'; end if; end \$q\$;"
      - name: Publish clean feature commit to main
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail; set +x
          current=$(git ls-remote https://x-access-token:"$GH_TOKEN"@github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')
          test "$current" = "$START_MAIN"
          git push https://x-access-token:"$GH_TOKEN"@github.com/${GITHUB_REPOSITORY}.git "$FEATURE_COMMIT":refs/heads/main
      - name: Cleanup runner
        if: always()
        shell: bash
        run: |
          set +e
          npx --yes supabase@2.117.0 stop --no-backup >/tmp/supabase-stop.log 2>&1
          test "$(docker ps -aq --filter name=supabase_ | wc -l)" -eq 0
          test "$(docker volume ls -q --filter name=supabase_ | wc -l)" -eq 0
