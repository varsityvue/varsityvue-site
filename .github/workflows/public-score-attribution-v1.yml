name: Public live score attribution V1 verification
on:
  push:
    branches: [codex/public-live-score-attribution-v1]
  pull_request:
    paths:
      - '.github/workflows/public-score-attribution-v1.yml'
      - 'supabase/migrations/*public_live_score_attribution.sql'
      - 'supabase/tests/public_score_attribution.sql'
      - 'lib/public-score-*'
      - 'scripts/test-public-score-attribution-browser.mjs'
      - 'components/ScoreAttribution.tsx'
      - 'lib/dynamic-games.ts'
      - 'lib/scoreboard.ts'
      - 'types/platform.ts'
      - 'app/scoreboard/page.tsx'
      - 'app/games/[gameId]/page.tsx'
      - 'components/SchoolSeasonPulse.tsx'
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test lib/public-score-state.test.tsx lib/scoring-operations.test.ts lib/games.test.ts lib/school-scoring-averages.test.ts
      - run: npx tsc --noEmit
      - uses: supabase/setup-cli@v2
        with:
          version: 2.119.0
      - run: supabase init
      - run: supabase db start
      - run: supabase db reset --local --no-seed
      - name: Attribution database tests
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/public_score_attribution.sql
      - name: Seed isolated regression actors
        run: |
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres <<'SQL'
          insert into auth.users(id,instance_id,aud,role,email,encrypted_password,email_confirmed_at,raw_app_meta_data,raw_user_meta_data,created_at,updated_at)
          select ('00000000-0000-4000-8000-00000000090'||n)::uuid,'00000000-0000-0000-0000-000000000000','authenticated','authenticated',
          'regression-'||n||'@example.invalid','!',now(),'{}','{}',now(),now() from generate_series(1,3) n;
          insert into public.user_roles(user_id,role) values
          ('00000000-0000-4000-8000-000000000901','admin'),('00000000-0000-4000-8000-000000000902','moderator');
          SQL
      - name: Existing scoring and Pick Em regressions
        run: |
          for file in friday_scoring_operations game_score_corrections pickem_score_integration pickem_scoreless_outcome_origination; do
            PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "supabase/tests/$file.sql" || exit 1
          done
      - name: Existing concurrent scoring regressions
        run: |
          PGPASSWORD=postgres bash supabase/tests/friday_scoring_race.sh

      - name: Browser dependencies (no repository dependency changes)
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Disposable public score fixture from actual RPC
        run: |
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres <<'SQL'
          update public.profiles set username='abcdefghijklmnopqrstuvwxyz1234' where id='00000000-0000-4000-8000-000000000901';
          select set_config('request.jwt.claim.sub','00000000-0000-4000-8000-000000000901',false);
          set role authenticated;
          select public.submit_trusted_score_update('goldthwaite-at-miles-2026-week-6',0,7,'live','1st','08:00',null,null,null,true);
          reset role;
          update public.game_state set kickoff_override=now()-interval '1 minute' where game_id='goldthwaite-at-miles-2026-week-6';
          SQL
          PGPASSWORD=postgres psql -X -At -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "select jsonb_agg(s) from public.public_score_states() s where game_id='goldthwaite-at-miles-2026-week-6'" > "$RUNNER_TEMP/attribution-browser-fixture.json"
      - name: Responsive mounted-page verification
        env:
          ATTRIBUTION_BROWSER_FIXTURE: ${{ runner.temp }}/attribution-browser-fixture.json
        run: node scripts/test-public-score-attribution-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-browser-evidence
          path: attribution-browser-evidence
          if-no-files-found: ignore
