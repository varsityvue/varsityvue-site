name: Coverage demand analytics V1 verification
on:
  push:
    branches: [codex/coverage-demand-analytics-v1, coverage-activation-preparation]
  pull_request:
    paths:
      - 'lib/coverage-*'
      - 'types/coverage-demand.ts'
      - 'app/api/coverage-demand/**'
      - 'app/api/cron/coverage-demand-retention/**'
      - 'app/privacy/**'
      - 'components/Footer.tsx'
      - 'docs/coverage-demand-activation-preparation.md'
      - 'components/Weekly*.tsx'
      - 'components/useCoverageEpisode.ts'
      - 'components/CoverageMeasurementChoice.tsx'
      - 'proxy.ts'
      - 'supabase/migrations/*coverage_demand*'
      - 'supabase/tests/coverage_demand*'
      - 'scripts/test-coverage-demand*'
      - '.github/workflows/coverage-demand-v1.yml'
concurrency:
  group: coverage-demand-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # This bounded draft must not run consent activation or ingestion fixtures.
    if: github.head_ref != 'codex/games-filter-state-correction'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Analytics and all relevant application regressions
        run: node --import tsx --test lib/coverage-*.test.ts lib/game-discovery.test.ts lib/unified-games.test.ts lib/games-page-organization.test.ts lib/game-presentation.test.ts lib/public-score-loader.test.ts lib/hamilton-featured.test.ts lib/school-master-data.test.ts lib/team-feed-validation.test.ts lib/scorekeeper-cta.test.ts lib/public-read-contracts.test.ts lib/assigned-scorekeeper.test.ts lib/public-score-state.test.tsx lib/score-scout-review.test.tsx lib/scoring-operations.test.ts lib/games.test.ts data/game-previews.test.ts lib/pickem-lifecycle.test.ts lib/pickem-client-state.test.ts lib/pickem-week-summary.test.ts lib/pickem-contest-display.test.ts lib/team-feed-image.test.ts lib/follow-personalization.test.ts
      - run: npx tsc --noEmit
      - run: npx eslint components/Weekly*.tsx components/useCoverageEpisode.ts components/CoverageMeasurementChoice.tsx lib/coverage-*.ts lib/game-discovery.test.ts types/coverage-demand.ts app/api/coverage-demand/route.ts app/api/cron/coverage-demand-retention/route.ts app/privacy/page.tsx components/Footer.tsx proxy.ts scripts/test-coverage-demand-browser.mjs scripts/test-coverage-demand-http.mjs
      - run: npm run build
      - run: git diff --check
      - name: Browser tooling (test-only; no package manifest change)
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Released unified aliases, school, CTA, refresh and privacy browser regressions
        run: node scripts/test-unified-games-browser.mjs
      - name: Coverage consent, episodes, privacy and failure browser verification
        run: node scripts/test-coverage-demand-browser.mjs
      - uses: supabase/setup-cli@v2
        with:
          version: 2.119.0
      - run: supabase init
      - run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,inbucket
      - run: supabase db reset --local --no-seed
      - name: Aggregate-only security, authorization, suppression and retention
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/coverage_demand_analytics.sql
      - name: Operational maintenance backlog, status, postcondition rollback and retries
        run: PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/coverage_demand_operations.sql
      - name: Maintenance locking and concurrent ingestion
        run: bash supabase/tests/coverage_demand_operations_race.sh
      - name: Concurrent aggregate increment
        run: bash supabase/tests/coverage_demand_race.sh
      - name: Real first-party HTTP ingestion into isolated Supabase
        run: |
          supabase status -o env > "$RUNNER_TEMP/coverage-local.env"
          COVERAGE_LOCAL_ENV="$RUNNER_TEMP/coverage-local.env" node --import tsx scripts/test-coverage-demand-http.mjs
      - name: Existing privacy, score authority, Score Scout and Pick Em database regressions
        run: |
          for file in public_uuid_hardening public_score_attribution assigned_scorekeeper_live score_scout_approval pickem_week6_contest pickem_conversion_report pickem_future_week_admin; do
            supabase db reset --local --no-seed
            PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f "supabase/tests/$file.sql" || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-demand-browser-evidence
          path: |
            coverage-demand-browser-evidence
            unified-games-browser-evidence
          if-no-files-found: ignore
